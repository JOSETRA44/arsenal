[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-arsenal"
version = "0.1.0"
description = "One entry point across the research MCP CLIs in this workspace: discover, search, run and audit them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "cli", "research", "orchestration", "conformance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Environment :: Console",
]
# Deliberately zero runtime dependencies: the arsenal must be runnable from a
# bare checkout to audit tools that are themselves not installed yet.
dependencies = []

[project.scripts]
arsenal = "arsenal.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/arsenal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
